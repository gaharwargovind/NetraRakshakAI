experiment:
  description: Standard pre-trained EfficientNet-B0 with Cross-Entropy Loss
  id: E001
  name: Baseline 5-Class Classifier
  seed: 42
metrics:
  primary: macro_f1
  secondary:
  - quadratic_weighted_kappa
  - referable_sensitivity
  - referable_specificity
model:
  backbone: efficientnet_b0
  dropout_rate: 0.2
  num_classes: 5
  pretrained: true
training:
  batch_size: 16
  early_stopping_patience: 7
  epochs: 30
  learning_rate: 0.0003
  loss: cross_entropy
  lr_scheduler: cosine_annealing
  optimizer: AdamW
  weight_decay: 1.0e-05
